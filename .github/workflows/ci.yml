name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Его читают и alembic (migrations/env.py), и тесты (get_database_url в tests/conftest.py)
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy src
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head
      - name: Models match migrations
        run: uv run alembic check
      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=html
      - name: Coverage summary
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: backend/htmlcov/
          retention-days: 14

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # Версия pnpm берётся из поля packageManager в package.json
      # Кэш хранилища pnpm включается самим действием (cache: true)
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
      # Это действие не ставит Node.js
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build

  docker:
    # Сборка образов и сквозная проверка всего стека: ловит ошибки Dockerfile,
    # .dockerignore, entrypoint (миграции), nginx-прокси и настоящей сессии БД,
    # которых не видят ни юнит-, ни интеграционные тесты.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Prepare .env
        run: |
          cp .env.example .env
          # Плейсхолдер из .env.example приложение отвергает намеренно
          sed -i "s/^JWT_SECRET_KEY=.*/JWT_SECRET_KEY=$(openssl rand -hex 32)/" .env
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 180 db redis app frontend
      - name: Smoke test through nginx
        run: |
          BASE=http://localhost:8080/api
          LOGIN="ci-$(date +%s)"
          # У app нет healthcheck: контейнер "запущен" ещё до конца миграций — ждём API.
          for i in $(seq 1 30); do
            curl -fsS "$BASE/openapi.json" >/dev/null && break
            [ "$i" = 30 ] && { echo "API did not become ready"; exit 1; }
            sleep 2
          done
          curl -fsS -X POST "$BASE/auth/signup" -H 'Content-Type: application/json' \
            -d "{\"login\": \"$LOGIN\", \"password\": \"secret123\"}"
          TOKEN=$(curl -fsS -X POST "$BASE/auth/login" -H 'Content-Type: application/json' \
            -d "{\"login\": \"$LOGIN\", \"password\": \"secret123\"}" | jq -r .accessToken)
          curl -fsS "$BASE/auth/me" -H "Authorization: Bearer $TOKEN" | jq -e ".login == \"$LOGIN\""
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v

# TODO e2e когда появятся, нужна ли schema.d.ts и проверка актуальности типов через pnpm gen api в ci и запушенным файлом
