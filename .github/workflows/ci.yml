name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app_test
      # Нужен шагам alembic (migrations/env.py читает DATABASE_URL). pytest подставляет его сам
      # в tests/conftest.py, а для отдельных шагов CI его нужно задать явно
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy src
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head
      - name: Models match migrations
        run: uv run alembic check
      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=html
      - name: Coverage summary
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: backend/htmlcov/
          retention-days: 14

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # Версия pnpm берётся из поля packageManager в package.json
      # Кэш хранилища pnpm включается самим действием (cache: true)
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
      # Это действие не ставит Node.js
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build

# TODO нужно ли добавить сборку docker, e2e когда появятся, нужна ли schema.d.ts и проверка актуальность типов через pnpm gen api в ci и запушенным файлом
