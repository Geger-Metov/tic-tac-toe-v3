[project]
name = "tic-tac-toe-v3"
version = "0.5.0"
description = "Tic-Tac-Toe REST API (FastAPI + SQLAlchemy + PostgreSQL) с Minimax и JWT-аутентификацией"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "pwdlib[argon2]>=0.2.1",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.9.0",
    "redis>=5.0.1",
    "celery>=5.4.0",
]

[tool.uv]
# Это приложение, а не библиотека — не нужно собирать и устанавливать сам
# проект как пакет (в отличие от uv-дефолта для проектов с pyproject.toml).
package = false

[dependency-groups]
# "dev" — специальная группа: uv sync ставит её по умолчанию вместе с
# основными зависимостями (в отличие от остальных groups, для которых
# понадобился бы --group <имя>). Для CI/прод-образа эти пакеты не нужны —
# Dockerfile использует "uv sync --no-dev" (см. Dockerfile).
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "mypy>=2.4.1",
    "ruff>=0.17.5",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Позволяет тестам делать "import tic_tac_toe" без --app-dir/PYTHONPATH —
# pytest сам добавляет src/ в sys.path перед сбором тестов.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042 (str+Enum -> StrEnum) меняет поведение str() у enum-ов; не трогаем без отдельной проверки.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]
# Импорты после правки sys.path / загрузки окружения — намеренно не в начале файла.
"migrations/env.py" = ["E402"]
"tests/conftest.py" = ["E402"]
# Маршруты намеренно превращают доменные исключения в HTTPException без цепочки.
"src/tic_tac_toe/web/route/*" = ["B904"]

[tool.mypy]
python_version = "3.15"

# Включаем строгий режим (рекомендуется для новых проектов)
strict = true

# Игнорировать ошибки в сторонних библиотеках, у которых нет типов
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
branch = true
omit = []

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# хз, что за ошибка с импортами
[tool.pyright]
extraPaths = ["src"]
