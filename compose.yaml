services:
  # Сервис с базой данных
  db:
    image: postgres:18-alpine # Используем готовый официальный образ
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432" # Пробрасываем порт на хост-машину (для отладки)
    volumes:
      - pgdata:/var/lib/postgresql # Сохраняем данные в томе
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Redis: refresh-токены и счётчики неудачных попыток входа
  redis:
    image: redis:8-alpine
    # AOF: сохранять записи на диск, чтобы refresh-токены переживали перезапуск
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379" # Пробрасываем порт на хост-машину (для отладки и тестов)
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Сервис с FastAPI-приложением
  app:
    build:
      context: ./backend # Dockerfile бэкенда лежит в backend/
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS}
      REDIS_URL: redis://redis:6379/0
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_ATTEMPT_WINDOW_SECONDS: ${LOGIN_ATTEMPT_WINDOW_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./backend/src/tic_tac_toe
          target: /app/tic_tac_toe

        - action: sync+restart
          path: ./backend/migrations
          target: /app/migrations

        - action: rebuild
          path: ./backend/pyproject.toml

        - action: rebuild
          path: ./backend/uv.lock

        - action: rebuild
          path: ./backend/alembic.ini

        - action: rebuild
          path: ./backend/docker-entrypoint.sh


  # Фронтенд: nginx раздаёт собранный React-клиент и проксирует /api на app
  # (так браузер видит один origin, и CORS не нужен). Открывать: http://localhost:${FRONTEND_PORT}
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      - app

  # RabbitMQ: брокер сообщений для Celery.
  # Версия закреплена на 4.2 намеренно: RabbitMQ 4.3 по умолчанию запрещает
  # "временные неэксклюзивные очереди" (transient_nonexcl_queues), а служебные
  # очереди Celery (удалённое управление, события) именно такие.
  rabbitmq:
    image: rabbitmq:4.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ttt}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ttt}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"                    # AMQP
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"       # веб-интерфейс управления
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Воркер Celery: тот же образ, что и у app, но вместо ENTRYPOINT с
  # миграциями и uvicorn запускается celery worker.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["celery", "-A", "tic_tac_toe.infrastructure.tasks.celery_app:celery_app", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-ttt}:${RABBITMQ_PASSWORD:-ttt}@rabbitmq:5672//
      ABANDONED_GAME_MAX_AGE_HOURS: ${ABANDONED_GAME_MAX_AGE_HOURS:-24}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./backend/src/tic_tac_toe
          target: /app/tic_tac_toe

  # Планировщик Celery (beat): раз в CLEANUP_INTERVAL_MINUTES кладёт задачу
  # очистки в очередь. Отдельным сервисом и ровно в одном экземпляре: два beat
  # ставили бы каждую задачу дважды.
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["celery", "-A", "tic_tac_toe.infrastructure.tasks.celery_app:celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-ttt}:${RABBITMQ_PASSWORD:-ttt}@rabbitmq:5672//
      CLEANUP_INTERVAL_MINUTES: ${CLEANUP_INTERVAL_MINUTES:-60}
    depends_on:
      rabbitmq:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./backend/src/tic_tac_toe
          target: /app/tic_tac_toe

# Определяем именованный том для хранения данных PostgreSQL
volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
